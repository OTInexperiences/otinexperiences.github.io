---
layout: default
---
<article class="post">
  <header class="post-header"><h1 class="post-title">All Categories</h1></header>
  <ul>
    {% assign sorted_categories = site.categories | sort %}
    {% for category in sorted_categories %}
      {% assign name = category[0] %}
      <li><a href="{{ '/categories/' | relative_url }}{{ name | slugify }}/">{{ name | escape }} ({{ category[1].size }})</a></li>
    {% endfor %}
  </ul>
</article>
